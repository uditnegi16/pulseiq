name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Secret scan
        run: detect-secrets scan --baseline .secrets.baseline

      - name: Unit tests
        run: pytest tests/unit

      # Fails the build when a model metric regresses past its threshold, or
      # when a result is implausibly good (the leakage tripwire).
      #
      # Committed reports under reports/ are the reference. Checks for models
      # not re-run in this PR are SKIPPED, not failed -- a change to the scraper
      # should not be blocked by an un-rerun fine-tune.
      - name: Metric regression gate
        run: python -m pulseiq.evaluation.regression_gate
