[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseiq"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "app"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
filterwarnings = ["error::DeprecationWarning"]
markers = ["slow: long-running tests", "integration: needs external services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# B008 forbids function calls in argument defaults. FastAPI's documented
# dependency-injection pattern is exactly that (`x = Depends(get_x)`), and the
# rule predates it. Suppressed for routers only, not project-wide.
"src/pulseiq/api/routers/*.py" = ["B008"]

[tool.black]
line-length = 100
[tool.pyright]
# Notebooks run on the Colab runtime, where torchao and google.colab exist and
# the local venv is irrelevant. Type-checking them against local packages
# produces only false positives -- all substantive code lives in src/ and is
# checked there.
exclude = ["notebooks", ".venv"]
