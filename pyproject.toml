[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseiq"
version = "0.1.0"
description = "Competitor pricing forecasting + review sentiment intelligence engine"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
filterwarnings = ["error::DeprecationWarning"]
markers = ["slow: long-running tests", "integration: needs external services"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks are excluded deliberately. Cells contain shell magic (!pip install)
# and long one-off commands that ruff reads as invalid Python. Linting them
# enforces module standards on an interactive scratchpad, which is the wrong
# tool for the job -- all substantive logic lives in src/ and is linted there.
extend-exclude = ["notebooks/", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
